<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempus</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempus">
<meta name="theme-color" content="#14161d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2314161d'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%238aa0b8' stroke-width='3'/%3E%3Cpath d='M32 32 L32 13 A19 19 0 0 1 48 24 Z' fill='%238aa0b8'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2314161d'/%3E%3Ccircle cx='90' cy='90' r='64' fill='none' stroke='%238aa0b8' stroke-width='8'/%3E%3Cpath d='M90 90 L90 36 A54 54 0 0 1 135 66 Z' fill='%238aa0b8'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#14161d;
    --accent:#8aa0b8;
    --surface:#1c1f29;
    --line:#2b2f3b;
    --ink:#ece9e1;
    --muted:#8b8f9c;
    --serif:'Amor Granada','Iowan Old Style',Georgia,'Times New Roman',serif;
    --mono:'Monoid','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:22px;
  }

  .top{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);gap:24px}
  .top .fecha{font-size:17px}
  .top .ahora{font-family:var(--mono);font-size:17px;color:var(--ink)}
  .ahora .sec{font-size:.56em;color:var(--muted);opacity:.15;margin-left:2px}

  .estado{margin-top:4px}
  .estado .rotulo{font-size:22px;color:var(--muted);margin-bottom:6px}
  .estado .grande{
    font-family:var(--mono);font-weight:600;line-height:.95;
    font-size:clamp(46px,15vw,88px);color:var(--accent);
    font-variant-numeric:tabular-nums;letter-spacing:-1px;
  }
  .estado .grande .sec{font-size:.4em;color:var(--muted);opacity:.1;margin-left:6px;letter-spacing:0}
  .estado .sub{margin-top:12px;color:var(--muted);font-size:16px;line-height:1.55}
  .estado .sub b{color:var(--ink);font-weight:600}

  .progreso{margin-top:16px;display:none}
  .progreso.on{display:block}
  .progreso .track{height:9px;border-radius:6px;background:var(--line);overflow:hidden}
  .progreso .fill{height:100%;width:0;background:var(--accent);transition:width .5s linear}
  .progreso .pct{margin-top:7px;color:var(--muted);font-size:14px;font-family:var(--mono)}

  .dial-wrap{display:flex;justify-content:center;padding:6px 0}
  svg.dial{width:min(320px,80vw);height:auto;display:block}
  .tick{stroke:var(--line);stroke-width:2}
  .tick.h{stroke:var(--muted);stroke-width:3}
  .num{fill:var(--ink);opacity:.16;font-family:var(--mono);font-size:10px;text-anchor:middle;dominant-baseline:central}
  .wedge{fill:var(--accent);opacity:.28}
  .hand-h{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
  .hand-m{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
  .hand-s{stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;opacity:.2}
  .dot{fill:var(--accent)}
  .rim{fill:none;stroke:var(--line);stroke-width:2}

  section h2{font-size:20px;font-weight:600;margin:0 0 12px}
  .lista{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .card .txt .lbl{font-size:17px}
  .card .txt .meta{color:var(--muted);font-size:14px;margin-top:3px;font-family:var(--mono)}
  .card .n{font-family:var(--mono);font-size:21px;color:var(--accent);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .card.done .n{color:var(--muted)}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;
    line-height:0;border-radius:8px}
  .icon-btn:hover{color:var(--ink)}
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .vacio{color:var(--muted);font-size:15px;padding:4px 2px}

  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font-family:inherit;font-size:16px;color:var(--ink)}
  input[type=text],input[type=datetime-local],input[type=time]{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;color:var(--ink);min-width:0}
  input[type=text]{flex:1}
  input[type=color]{width:48px;height:40px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);padding:2px;cursor:pointer}
  button.primary{background:var(--accent);color:#14161d;border:none;border-radius:10px;
    padding:11px 15px;font-weight:600;cursor:pointer;font-size:16px}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;cursor:pointer;font-size:15px;
    display:inline-flex;align-items:center;gap:7px}
  button.ghost svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  button.link{background:none;border:none;color:var(--accent);padding:6px 0;cursor:pointer;font-size:15px}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}

  details.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
  details.panel>summary{list-style:none;cursor:pointer;padding:16px 0;font-size:18px;font-weight:600;
    display:flex;justify-content:space-between;align-items:center}
  details.panel>summary::-webkit-details-marker{display:none}
  details.panel>summary::after{content:'+';color:var(--muted);font-family:var(--mono);font-size:20px}
  details.panel[open]>summary::after{content:'–'}
  .panel .body{padding:0 0 18px;display:flex;flex-direction:column;gap:16px}

  .dias{display:flex;flex-direction:column;gap:10px}
  .dia{display:grid;grid-template-columns:36px 44px 1fr 1fr;gap:9px;align-items:center}
  .dia .nom{font-size:15px}
  .dia input[type=time]{width:100%}
  .dia.off .nom{opacity:.4}
  .sw{position:relative;width:44px;height:26px;flex:0 0 auto}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .sw .knob{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.15s}
  .sw .knob::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
    border-radius:50%;background:var(--muted);transition:.15s}
  .sw input:checked + .knob{background:var(--accent)}
  .sw input:checked + .knob::after{transform:translateX(18px);background:#14161d}

  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .preset{display:inline-flex;align-items:center;gap:8px;background:var(--bg);
    border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--ink)}
  .preset .dot2{width:14px;height:14px;border-radius:50%}
  .preset.active{border-color:var(--accent)}

  .barra-inf{display:flex;gap:10px;flex-wrap:wrap}
  .footer{color:var(--muted);font-size:13px;font-family:var(--mono);text-align:center;
    display:flex;justify-content:center;align-items:center;gap:14px}
  .footer .link{font-family:var(--serif)}

  body.focus{justify-content:center;gap:34px}
  body.focus .top{justify-content:center}
  body.focus details.panel,body.focus .barra-inf,body.focus .footer{display:none}
  body.focus #zTimers h2,body.focus #zTimers>.row{display:none}
  body.focus #zTimers .card.done{display:none}
  body.focus #zTimers{text-align:center;max-width:520px;margin-inline:auto}
  body.focus #zTimers .card{justify-content:center;gap:18px}
  body.focus #zTimers .card .icon-btn{display:none}
  body.focus .progreso.on{display:block;width:min(320px,80vw);margin-inline:auto}
  body.focus .estado{text-align:center}
  #salirFocus{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:30}
  body.focus #salirFocus{display:inline-flex}

  /* Pantalla de carga */
  #loader{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .nombre{font-family:var(--serif);font-size:26px;letter-spacing:1px;color:var(--ink)}
  #loader svg{width:84px;height:84px}
  #loader .spin{transform-origin:42px 42px;animation:giro 1.1s linear infinite}
  @keyframes giro{to{transform:rotate(360deg)}}

  /* Tutorial (recorrido resaltado) */
  #tut{position:fixed;inset:0;z-index:50;display:none}
  #tut.on{display:block}
  #tutHole{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.78);
    transition:all .25s ease;pointer-events:none}
  #tutBox{position:absolute;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:16px;max-width:300px;color:var(--ink);font-size:15px;line-height:1.5}
  #tutBox .tb-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
  #tutBox .tb-x{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);
    font-size:22px;cursor:pointer;font-family:var(--serif);line-height:1}
  .hero{display:flex;flex-direction:column;gap:22px}
  @media (min-width:760px){
    body{max-width:940px;gap:28px}
    .top .fecha,.top .ahora{font-size:21px}
    .estado .rotulo{font-size:28px}
    .estado .grande{font-size:clamp(64px,9vw,108px)}
    .estado .sub{font-size:19px}
    section h2{font-size:23px}
    .card .txt .lbl{font-size:20px}
    .card .n{font-size:25px}
    .card .txt .meta{font-size:15px}
    .dia .nom{font-size:17px}
    details.panel>summary{font-size:20px}
    input,button,select{font-size:17px}
    .hero{flex-direction:row;align-items:center;gap:44px}
    .hero .estado{flex:1;min-width:0}
    .hero .dial-wrap{flex:0 0 auto}
    svg.dial{width:300px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <div id="loader">
    <svg viewBox="0 0 84 84" aria-hidden="true">
      <circle cx="42" cy="42" r="30" fill="none" stroke="#2b2f3b" stroke-width="3"/>
      <line class="spin" x1="42" y1="42" x2="42" y2="18" stroke="#8aa0b8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="42" cy="42" r="4" fill="#8aa0b8"/>
    </svg>
    <div class="nombre">Tempus</div>
  </div>

  <button id="salirFocus" class="ghost">Salir</button>

  <div class="top">
    <div class="fecha" id="fecha">—</div>
    <div class="ahora" id="ahora">--:--</div>
  </div>

  <div class="hero">
  <div class="estado" id="zEstado">
    <div class="rotulo" id="rotulo">Cargando…</div>
    <div class="grande" id="grande">--</div>
    <div class="sub" id="sub"></div>
    <div class="progreso" id="progreso">
      <div class="track"><div class="fill" id="progFill"></div></div>
      <div class="pct" id="progPct"></div>
    </div>
  </div>

  <div class="dial-wrap" id="zDial">
    <svg class="dial" viewBox="0 0 200 200" id="dial" aria-hidden="true">
      <circle class="rim" cx="100" cy="100" r="94"/>
      <path class="wedge" id="wedge" d=""/>
      <g id="ticks"></g>
      <g id="nums"></g>
      <line class="hand-h" id="hh" x1="100" y1="100" x2="100" y2="52"/>
      <line class="hand-m" id="hm" x1="100" y1="100" x2="100" y2="34"/>
      <line class="hand-s" id="hs" x1="100" y1="100" x2="100" y2="30"/>
      <circle class="dot" cx="100" cy="100" r="4"/>
    </svg>
  </div>
  </div>

  <section id="zTimers">
    <h2>Cuentas puntuales</h2>
    <div class="lista" id="lista"></div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="nvLbl" placeholder="Ej.: ver a mi novio" maxlength="40" list="sug">
      <datalist id="sug"></datalist>
      <input type="datetime-local" id="nvFecha">
      <button class="primary" id="addTimer">Añadir</button>
    </div>
  </section>

  <details class="panel" id="zHorario">
    <summary>Horario laboral</summary>
    <div class="body">
      <div class="dias" id="dias"></div>
      <div class="vacio">Activa cada día y pon la hora de entrada y de salida. Se guarda solo.</div>
    </div>
  </details>

  <details class="panel" id="zColores">
    <summary>Colores</summary>
    <div class="body">
      <div class="presets" id="presets"></div>
      <div class="row" style="gap:18px">
        <label class="field">Color principal
          <input type="color" id="cAccent" value="#8aa0b8"></label>
        <label class="field">Fondo
          <input type="color" id="cBg" value="#14161d"></label>
      </div>
      <div class="row">
        <input type="text" id="presetName" placeholder="Nombre de la combinación" maxlength="24">
        <button class="ghost" id="savePreset">Guardar</button>
        <button class="link" id="resetColor">Restablecer</button>
      </div>
    </div>
  </details>

  <div class="barra-inf" id="zBarra">
    <button class="ghost" id="btnFocus">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Pantalla completa</button>
    <button class="ghost" id="btnExport">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Exportar</button>
    <button class="ghost" id="btnImport">
      <svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></svg>Importar</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </div>

  <div class="footer">
    <span id="ver">—</span>
    <button class="link" id="btnTutorial">Tutorial</button>
  </div>

  <!-- Tutorial -->
  <div id="tut">
    <div id="tutHole"></div>
    <div id="tutBox">
      <button class="tb-x" id="tutX" aria-label="Cerrar">×</button>
      <div id="tutTxt"></div>
      <div class="tb-row">
        <button class="link" id="tutNunca">No volver a mostrar</button>
        <button class="primary" id="tutNext">Siguiente</button>
      </div>
    </div>
  </div>

<script>
/* ===== Versión (número técnico + paleta activa) ===== */
const VER_NUM='1.1';

/* ===== Almacenamiento con reserva en memoria ===== */
const KEY='tempus_v1', mem={};
const store={
  get(){ try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return mem[KEY]||null;} },
  set(v){ const s=JSON.stringify(v); try{localStorage.setItem(KEY,s);}catch(e){mem[KEY]=v;} }
};

/* ===== Estado ===== */
const DIAS=[['dom','Dom'],['lun','Lun'],['mar','Mar'],['mie','Mié'],['jue','Jue'],['vie','Vie'],['sab','Sáb']];
const DEFAULT={
  colors:{accent:'#8aa0b8',bg:'#14161d'},
  paletteName:'Niebla',
  palettes:[
    {name:'Niebla',accent:'#8aa0b8',bg:'#14161d'},
    {name:'Sol',accent:'#d8a24a',bg:'#14161d'},
    {name:'Malva',accent:'#a88fb0',bg:'#161320'}
  ],
  schedule:{ dom:{on:false,in:'09:00',out:'17:00'}, lun:{on:true,in:'09:00',out:'17:00'},
    mar:{on:true,in:'09:00',out:'17:00'}, mie:{on:true,in:'09:00',out:'17:00'},
    jue:{on:true,in:'09:00',out:'17:00'}, vie:{on:true,in:'09:00',out:'17:00'},
    sab:{on:false,in:'09:00',out:'17:00'} },
  timers:[], labelsUsed:[], tutorialSeen:false
};
let state=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),store.get()||{});
DIAS.forEach(([k])=>{ state.schedule[k]=Object.assign({on:false,in:'09:00',out:'17:00'},state.schedule[k]||{}); });
if(!Array.isArray(state.palettes)||!state.palettes.length) state.palettes=JSON.parse(JSON.stringify(DEFAULT.palettes));
function save(){ store.set(state); }

/* ===== Tiempo ===== */
function atToday(base,hm){ const d=new Date(base); const [h,m]=hm.split(':').map(Number); d.setHours(h,m,0,0); return d; }
function keyOf(d){ return DIAS[d.getDay()][0]; }
// Devuelve {main, sec}: main sin segundos, sec = segundos (para mostrarlos tenues)
function fmt(ms){
  if(ms<0) ms=0;
  const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor((s%86400)/3600),
        m=Math.floor((s%3600)/60), ss=s%60, p=n=>String(n).padStart(2,'0');
  if(d>=1) return {main: h>0?`${d} d ${h} h`:`${d} d`, sec:''};
  return {main:`${p(h)}:${p(m)}`, sec:p(ss)};
}
function nextShift(from){
  for(let i=0;i<8;i++){
    const d=new Date(from); d.setDate(d.getDate()+i);
    const cfg=state.schedule[keyOf(d)]; if(!cfg||!cfg.on) continue;
    const ini=atToday(d,cfg.in); if(i===0&&ini<=from) continue;
    return {inicio:ini,cfg};
  } return null;
}
function workdaysLeft(now){
  const last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(); let n=0;
  for(let day=now.getDate();day<=last;day++){
    const d=new Date(now.getFullYear(),now.getMonth(),day);
    if(state.schedule[keyOf(d)].on) n++;
  } return n;
}
function computePrimary(now){
  const cfg=state.schedule[keyOf(now)];
  if(cfg&&cfg.on){
    const ini=atToday(now,cfg.in), fin=atToday(now,cfg.out);
    if(now<ini) return {fase:'antes',target:ini,ini,fin};
    if(now>=ini&&now<fin) return {fase:'dentro',target:fin,ini,fin};
  }
  const nx=nextShift(now);
  if(nx) return {fase:'siguiente',target:nx.inicio};
  return {fase:'ninguno'};
}

/* ===== Reloj analógico ===== */
function ang(date){ return ((date.getHours()%12)+date.getMinutes()/60+date.getSeconds()/3600)*30; }
function pt(cx,cy,r,a){ const rad=(a-90)*Math.PI/180; return [cx+r*Math.cos(rad),cy+r*Math.sin(rad)]; }
function buildTicks(){
  let t=''; for(let i=0;i<60;i++){ const a=i*6, inner=i%5===0?82:88;
    const [x1,y1]=pt(100,100,inner,a),[x2,y2]=pt(100,100,94,a);
    t+=`<line class="tick ${i%5===0?'h':''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }
  document.getElementById('ticks').innerHTML=t;
  let n=''; for(let i=1;i<=12;i++){ const [x,y]=pt(100,100,70,i*30);
    n+=`<text class="num" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${i}</text>`; }
  document.getElementById('nums').innerHTML=n;
}
function drawWedge(now,prim){
  const w=document.getElementById('wedge');
  const intradia=(prim.fase==='antes'||prim.fase==='dentro')&&(prim.target-now)<=12*3600*1000;
  if(!intradia){ w.setAttribute('d',''); return; }
  const aN=ang(now),aT=ang(prim.target); let sweep=(aT-aN+360)%360;
  if(sweep===0){ w.setAttribute('d',''); return; }
  const r=80,[x1,y1]=pt(100,100,r,aN),[x2,y2]=pt(100,100,r,aT),large=sweep>180?1:0;
  w.setAttribute('d',`M100 100 L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`);
}
function setHands(now){
  const s=now.getSeconds()+now.getMilliseconds()/1000, m=now.getMinutes()+s/60, h=(now.getHours()%12)+m/60;
  const put=(id,r,a)=>{ const [x,y]=pt(100,100,r,a),el=document.getElementById(id);
    el.setAttribute('x2',x.toFixed(2)); el.setAttribute('y2',y.toFixed(2)); };
  put('hh',48,h*30); put('hm',66,m*6); put('hs',70,s*6);
}

/* ===== Render ===== */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIASL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function bigHTML(o){ return o.sec?`${o.main}<span class="sec">${o.sec}</span>`:o.main; }
function render(){
  const now=new Date();
  const p2=n=>String(n).padStart(2,'0');
  document.getElementById('ahora').innerHTML=
    `${p2(now.getHours())}:${p2(now.getMinutes())}<span class="sec">${p2(now.getSeconds())}</span>`;
  document.getElementById('fecha').textContent=`${DIASL[now.getDay()]}, ${now.getDate()} de ${MESES[now.getMonth()]}`;

  const prim=computePrimary(now), rot=document.getElementById('rotulo'),
        big=document.getElementById('grande'), sub=document.getElementById('sub'),
        prog=document.getElementById('progreso'), wdl=workdaysLeft(now),
        wdlTxt=`Te quedan <b>${wdl}</b> ${wdl===1?'día laborable':'días laborables'} este mes`;

  if(prim.fase==='antes'){
    rot.textContent='Entras en'; big.innerHTML=bigHTML(fmt(prim.target-now));
    sub.innerHTML=`Turno de hoy: ${prim.ini.toTimeString().slice(0,5)}–${prim.fin.toTimeString().slice(0,5)} · ${wdlTxt}`;
    prog.classList.remove('on');
  }else if(prim.fase==='dentro'){
    rot.textContent='Sales en'; big.innerHTML=bigHTML(fmt(prim.target-now));
    const tot=prim.fin-prim.ini, el=now-prim.ini, pc=Math.min(100,Math.max(0,el/tot*100));
    document.getElementById('progFill').style.width=pc+'%';
    document.getElementById('progPct').textContent=`Turno: ${pc.toFixed(0)} % completado`;
    sub.innerHTML=`Entraste a las ${prim.ini.toTimeString().slice(0,5)} · ${wdlTxt}`;
    prog.classList.add('on');
  }else if(prim.fase==='siguiente'){
    rot.textContent='Próximo turno'; big.innerHTML=bigHTML(fmt(prim.target-now));
    sub.innerHTML=`${DIASL[prim.target.getDay()]} a las ${prim.target.toTimeString().slice(0,5)} · ${wdlTxt}`;
    prog.classList.remove('on');
  }else{
    rot.textContent='Sin turnos'; big.textContent='—';
    sub.innerHTML='Configura tu horario laboral abajo.'; prog.classList.remove('on');
  }
  setHands(now); drawWedge(now,prim); renderTimers(now);
  requestAnimationFrame(loop);
}
let last=-1;
function loop(){ const s=Math.floor(Date.now()/200); if(s!==last){ last=s; render(); } else requestAnimationFrame(loop); }

/* ===== Cuentas puntuales ===== */
const TRASH='<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>';
function renderTimers(now){
  const cont=document.getElementById('lista');
  if(!state.timers.length){ cont.innerHTML='<div class="vacio">Aún no hay cuentas puntuales. Añade una abajo.</div>'; return; }
  const ord=[...state.timers].sort((a,b)=>new Date(a.target)-new Date(b.target));
  cont.innerHTML='';
  ord.forEach(t=>{
    const target=new Date(t.target), diff=target-now, done=diff<=0,
      f=target.toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    const o=fmt(diff), card=document.createElement('div'); card.className='card'+(done?' done':'');
    card.innerHTML=`<div class="txt"><div class="lbl">${esc(t.label)}</div><div class="meta">${f}</div></div>
      <div class="n">${done?'Cumplido':o.main}</div>
      <button class="icon-btn" data-id="${t.id}" aria-label="Borrar">${TRASH}</button>`;
    cont.appendChild(card);
  });
  cont.querySelectorAll('.icon-btn').forEach(b=>b.onclick=()=>{
    state.timers=state.timers.filter(x=>x.id!==b.dataset.id); save(); renderTimers(new Date()); });
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function buildSug(){
  const base=['ver a mi novio','cumpleaños','vacaciones','cita','viaje','concierto','entrega','examen'];
  const all=[...new Set([...state.labelsUsed,...base])];
  document.getElementById('sug').innerHTML=all.map(v=>`<option value="${esc(v)}">`).join('');
}
document.getElementById('addTimer').onclick=()=>{
  const lbl=document.getElementById('nvLbl').value.trim(), f=document.getElementById('nvFecha').value;
  if(!lbl||!f) return;
  state.timers.push({id:String(Date.now()),label:lbl,target:new Date(f).toISOString()});
  if(!state.labelsUsed.includes(lbl)) state.labelsUsed.unshift(lbl);
  state.labelsUsed=state.labelsUsed.slice(0,20); save(); buildSug();
  document.getElementById('nvLbl').value=''; document.getElementById('nvFecha').value='';
  renderTimers(new Date());
};

/* ===== Horario ===== */
function buildDias(){
  const cont=document.getElementById('dias'); cont.innerHTML='';
  DIAS.forEach(([k,nom])=>{
    const c=state.schedule[k], row=document.createElement('div'); row.className='dia'+(c.on?'':' off');
    row.innerHTML=`<span class="nom">${nom}</span>
      <label class="sw"><input type="checkbox" ${c.on?'checked':''} data-k="${k}" data-f="on"><span class="knob"></span></label>
      <input type="time" value="${c.in}" data-k="${k}" data-f="in">
      <input type="time" value="${c.out}" data-k="${k}" data-f="out">`;
    cont.appendChild(row);
  });
  cont.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
    const {k,f}=inp.dataset; state.schedule[k][f]=f==='on'?inp.checked:inp.value; save(); buildDias(); });
}

/* ===== Colores y presets ===== */
function activePaletteName(){
  const hit=state.palettes.find(p=>p.accent.toLowerCase()===state.colors.accent.toLowerCase()
    && p.bg.toLowerCase()===state.colors.bg.toLowerCase());
  return hit?hit.name:'Personalizada';
}
function applyColors(){
  document.documentElement.style.setProperty('--accent',state.colors.accent);
  document.documentElement.style.setProperty('--bg',state.colors.bg);
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.setAttribute('content',state.colors.bg);
  document.getElementById('cAccent').value=state.colors.accent;
  document.getElementById('cBg').value=state.colors.bg;
  state.paletteName=activePaletteName();
  document.getElementById('ver').textContent=`${VER_NUM} · ${state.paletteName}`;
  buildPresets();
}
function buildPresets(){
  const cont=document.getElementById('presets'); cont.innerHTML='';
  state.palettes.forEach((p,i)=>{
    const active=p.name===state.paletteName&&activePaletteName()!=='Personalizada';
    const el=document.createElement('button'); el.className='preset'+(active?' active':'');
    el.innerHTML=`<span class="dot2" style="background:${p.accent}"></span>${esc(p.name)}`;
    el.onclick=()=>{ state.colors={accent:p.accent,bg:p.bg}; save(); applyColors(); };
    cont.appendChild(el);
  });
}
function bindColor(id,key){
  const el=document.getElementById(id);
  const h=e=>{ state.colors[key]=e.target.value; save(); applyColors(); };
  el.addEventListener('input',h); el.addEventListener('change',h);
}
bindColor('cAccent','accent'); bindColor('cBg','bg');
document.getElementById('resetColor').onclick=()=>{state.colors={...DEFAULT.colors};save();applyColors();};
document.getElementById('savePreset').onclick=()=>{
  const inp=document.getElementById('presetName'), nombre=inp.value.trim();
  if(!nombre){ inp.focus(); return; }
  state.palettes=state.palettes.filter(p=>p.name.toLowerCase()!==nombre.toLowerCase());
  state.palettes.push({name:nombre,accent:state.colors.accent,bg:state.colors.bg});
  inp.value=''; save(); applyColors();
};

/* ===== Exportar / importar ===== */
document.getElementById('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='tempus.json'; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange=e=>{
  const file=e.target.files[0]; if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(d.schedule)state.schedule=d.schedule; if(d.timers)state.timers=d.timers;
      if(d.colors)state.colors=d.colors; if(d.palettes)state.palettes=d.palettes;
      if(d.labelsUsed)state.labelsUsed=d.labelsUsed;
      DIAS.forEach(([k])=>{state.schedule[k]=Object.assign({on:false,in:'09:00',out:'17:00'},state.schedule[k]||{});});
      save(); applyColors(); buildDias(); buildSug(); renderTimers(new Date());
    }catch(err){ alert('El archivo no es válido.'); } };
  r.readAsText(file); e.target.value='';
};

/* ===== Pantalla completa + no apagar pantalla ===== */
let wakeLock=null;
async function acquireWake(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
async function releaseWake(){ try{ if(wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener('visibilitychange',()=>{
  if(document.body.classList.contains('focus')&&document.visibilityState==='visible') acquireWake(); });
document.getElementById('btnFocus').onclick=async()=>{
  document.body.classList.add('focus');
  try{ await document.documentElement.requestFullscreen(); }catch(e){} acquireWake(); };
document.getElementById('salirFocus').onclick=async()=>{
  document.body.classList.remove('focus');
  try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch(e){} releaseWake(); };

/* ===== Manifiesto en línea ===== */

  const icon="data:image/svg+xml,"+encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='"+state.colors.bg+"'/><circle cx='96' cy='96' r='70' fill='none' stroke='"+state.colors.accent+"' stroke-width='9'/><path d='M96 96 L96 40 A56 56 0 0 1 143 71 Z' fill='"+state.colors.accent+"'/></svg>");
  const man={name:"Tempus",short_name:"Tempus",display:"standalone",background_color:state.colors.bg,
    theme_color:state.colors.bg,start_url:".",icons:[{src:icon,sizes:"192x192",type:"image/svg+xml"},{src:icon,sizes:"512x512",type:"image/svg+xml"}]};
  const url=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
  const l=document.createElement('link'); l.rel='manifest'; l.href=url; document.head.appendChild(l);
})();

/* ===== Tutorial (recorrido resaltado, solo zonas visibles) ===== */
const PASOS=[
  {sel:'#zEstado',txt:'Aquí, grande, cuánto falta para entrar o salir del trabajo. Debajo, tus días laborables del mes.'},
  {sel:'#zDial',txt:'El reloj analógico. El “quesito” de color marca la misma cuenta cuando es dentro del mismo día.'},
  {sel:'#zTimers',txt:'Cuentas puntuales de una sola vez: pon una etiqueta y una fecha (por ejemplo, ver a tu novio).'},
  {sel:'#zHorario',txt:'Tu horario laboral, día por día. Actívalo y pon entrada y salida. Se guarda solo.'},
  {sel:'#zColores',txt:'Colores personalizables. Elige un color guardado o crea el tuyo y guárdalo.'},
  {sel:'#zBarra',txt:'Pantalla completa (mantiene la pantalla encendida) y copia de seguridad en un archivo.'}
];
let paso=0;
function showPaso(){
  const s=PASOS[paso]; const el=document.querySelector(s.sel);
  if(!el){ endTut(); return; }
  el.scrollIntoView({block:'center',behavior:'auto'});
  setTimeout(()=>{
    const r=el.getBoundingClientRect(), pad=8, hole=document.getElementById('tutHole'), box=document.getElementById('tutBox');
    hole.style.left=(r.left-pad)+'px'; hole.style.top=(r.top-pad)+'px';
    hole.style.width=(r.width+pad*2)+'px'; hole.style.height=(r.height+pad*2)+'px';
    document.getElementById('tutTxt').textContent=s.txt;
    document.getElementById('tutNext').textContent = paso===PASOS.length-1?'Terminar':'Siguiente';
    let top=r.bottom+14; if(top+150>window.innerHeight) top=Math.max(14,r.top-160);
    box.style.top=top+'px'; box.style.left=Math.max(12,Math.min(window.innerWidth-312,r.left))+'px';
  },60);
}
function startTut(){ paso=0; document.getElementById('tut').classList.add('on'); showPaso(); }
function endTut(){ document.getElementById('tut').classList.remove('on'); }
document.getElementById('tutNext').onclick=()=>{ paso++; if(paso>=PASOS.length){ endTut(); } else showPaso(); };
document.getElementById('tutX').onclick=endTut;
document.getElementById('tutNunca').onclick=()=>{ state.tutorialSeen=true; save(); endTut(); };
document.getElementById('btnTutorial').onclick=startTut;

/* ===== Arranque ===== */
applyColors(); buildTicks(); buildDias(); buildSug(); render();
window.addEventListener('load',()=>{
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),800);
  if(!state.tutorialSeen) setTimeout(startTut,1200);
});
</script>
